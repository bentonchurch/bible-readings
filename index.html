<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="styles.css" />

  <link rel="icon" type="image/x-icon" href="/icons/favicon.ico" />

  <title>Daily Bible Readings</title>
</head>

<body>
  <div class="modal fade" id="popover-background" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog" id="popover">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5">Edit List</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" onClick="resetData(); setPopoverDisplay(false);"></button>
        </div>
        <div class="modal-body" id="popover-content"></div>
        <div class="modal-footer">
          <button type="button" id="popover-cancel" onClick="resetData(); setPopoverDisplay(false);" class="btn btn-secondary"><i class="bi bi-x"></i> Cancel</button>
          <button type="button" id="popover-done" onClick="setData(); setPopoverDisplay(false);" class="btn btn-primary"><i class="bi bi-check2"></i> Save</button>
        </div>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="today card">
      <div class="card-body">
        <div class="d-flex flex-row align-items-center mb-2 gap-2">
          <div onclick="play()" id="audiotrigger" class="btn btn-primary btn-lg"><i class="bi bi-play-fill"></i></div>
          <h5 class="card-title mb-0" id="curDate"></h5>
        </div>
        <div class="list-group" id="todayContent"></div>
      </div>
    </div>

    <button id="lists-toggle" onclick="bucketDisplayToggle();" class="btn btn-primary">Show lists <i class="bi bi-chevron-down"></i></button>

    <div id="buckets" style="display: none;"></div>
  </div>
</body>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script src="js/initCache.js?v=1"></script>
<script src="js/calculateBook.js?v=1"></script>
<script src="js/popover.js?v=1"></script>
<script src="js/script.js?v=1"></script>
<script src="js/setHeaderDate.js?v=1"></script>
<script src="js/showToday.js?v=1"></script>
<script src="js/showBuckets.js?v=1"></script>

</html>
