<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="styles.css" />

  <link rel="preload" as="image" href="https://i.ibb.co/gZyTptB/pause.png" />
  <link rel="preload" as="image" href="https://i.ibb.co/VYn65yg/play.png" />
  <link rel="preload" as="image" href="https://i.ibb.co/RQ2cpDv/hourglass.png" />

  <link rel="icon" type="image/x-icon" href="/icons/favicon.ico" />

  <title>Daily Bible Readings</title>

  <script src="js/initCache.js"></script>
  <script src="js/calculateBook.js"></script>
  <script src="js/popover.js"></script>
  <script src="js/script.js"></script>
</head>

<body>
  <div id="popover-background">
    <div id="popover">
      <div id="popover-content"></div>
      <center>
        <button type="button" id="popover-done" onClick="setData(); setPopoverDisplay(false);" class="btn btn-primary">Save</button>
        <button type="button" id="popover-cancel" onClick="resetData(); setPopoverDisplay(false);" class="btn btn-secondary">Cancel</button>
      </center>
    </div>
  </div>

  <div class="content">
    <div class="today card card-body">
      <h3 id="curDate"></h3>
      <div onclick="play()" id="audiotrigger" class="btn btn-primary play"><i class="bi bi-play-fill"></i></div>
      <script src="js/setHeaderDate.js"></script>
      <hr />
      <ol id="todayContent"></ol>
      <script src="js/showToday.js"></script>
    </div>

    <button id="show-list" onclick="bucketDisplay(true);" class="btn btn-primary">Show lists</button>
    <button id="hide-list" onclick="bucketDisplay(false);" class="btn btn-primary" style="display: none;">Hide lists</button>

    <div id="buckets" style="display: none;"></div>
    <script src="js/showBuckets.js"></script>
    <br />
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>

</html>
